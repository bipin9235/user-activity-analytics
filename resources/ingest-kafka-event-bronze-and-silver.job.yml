resources:
  jobs:
    ingest_kafka_event_bronze:
      name: "${bundle.target}-ingest-kafka-event-bronze-and-silver"

      trigger:
        periodic:
          interval: 12
          unit: HOURS

      tasks:
        - task_key: ingest-kafka-events-bronze

          notebook_task:
            notebook_path: ../notebooks/ingest-kafka-events-bronze.ipynb

            base_parameters:
              secrets_path: ${var.secrets_path}
              bootstrap_servers: ${var.bootstrap_servers}
              topic: ${var.topic}
              bronze_checkpoint_path: ${var.bronze_checkpoint_path}
              bronze_table_name: ${var.bronze_table_name}
              power_meter_key_schema_name: ${var.power_meter_key_schema_name}
              power_meter_value_schema_name: ${var.power_meter_value_schema_name}
              schema_registry_url: ${var.schema_registry_url}
              log_level: ${var.log_level}
              audit_table_name: ${var.audit_table_name}
          environment_key: default

        - task_key: telemetry-bronze-to-silver
          depends_on:
            - task_key: ingest-kafka-events-bronze
          notebook_task:
            notebook_path: ../notebooks/telemetry-bronze-to-silver.ipynb
            base_parameters:
              bronze_table_name: ${var.bronze_table_name}
              reference_table_name: ${var.reference_table_name}
              silver_table_name: ${var.silver_table_name}
              log_level: ${var.log_level}
              audit_table_name: ${var.audit_table_name}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: '6'
            dependencies:
              - ${workspace.artifact_path}/.internal/analytical_pipeline-0.0.1-py3-none-any.whl

      notification_settings:
        no_alert_for_skipped_runs: true
      email_notifications:
        on_failure:
          - imbipin8858@gmail.com
      queue:
        enabled: true