resources:
  jobs:
    ingest_kafka_event_bronze:
      name: "${bundle.target}-ingest-kafka-event-bronze"

      trigger:
        periodic:
          interval: 15
          unit: DAYS

      tasks:
        - task_key: ingest-kafka-events-bronze

          notebook_task:
            notebook_path: ../notebooks/ingest-kafka-events-bronze.ipynb

            base_parameters:
              secrets_path: ${var.secrets_path}
              bootstrap_servers: ${var.bootstrap_servers}
              topic: ${var.topic}
              bronze_checkpoint_path: ${var.bronze_checkpoint_path}
              bronze_table_name: ${var.bronze_table_name}
              power_meter_key_schema_name: ${var.power_meter_key_schema_name}
              power_meter_value_schema_name: ${var.power_meter_value_schema_name}
              schema_registry_url: ${var.schema_registry_url}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: '4'
            dependencies:
              - ${workspace.artifact_path}/.internal/analytical_pipeline-0.0.1-py3-none-any.whl