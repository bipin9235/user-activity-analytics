resources:
  jobs:
    publish-telemetry-to-kafka:
      name: "${bundle.target}-publish-telemetry-to-kafka"
      trigger:
        periodic:
          interval: 12
          unit: HOURS
      tasks:
        - task_key: publish-telemetry-to-kafka
          notebook_task:
            notebook_path: ../notebooks/publish-telemetry-messages-to-kafka.ipynb
            base_parameters:
              iot_raw_table_name: ${var.iot_raw_table_name}
              secrets_path: ${var.secrets_path}
              bootstrap_servers: ${var.bootstrap_servers}
              topic: ${var.topic}
              schema_registry_url: ${var.schema_registry_url}
              power_meter_key_schema_name: ${var.power_meter_key_schema_name}
              power_meter_value_schema_name: ${var.power_meter_value_schema_name}
              log_level: ${var.log_level}
              audit_table_name: ${var.audit_table_name}
              job_name: ${bundle.target}-publish-telemetry-to-kafka
              task_name: publish-telemetry-to-kafka
              duration_in_hours: '12'
              number_of_events_per_hour: '4'
              run_id: "{{job.run_id}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: '6'
            dependencies:
              - confluent-kafka[avro]
              - ${workspace.artifact_path}/.internal/analytical_pipeline-0.0.1-py3-none-any.whl
      notification_settings:
        no_alert_for_skipped_runs: true
      email_notifications:
        on_failure:
          - imbipin8858@gmail.com
      queue:
        enabled: true
